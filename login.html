<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student Career Hub</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                            800: '#3730a3', 900: '#312e81',
                        },
                        slate: {
                            850: '#151e2e',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300 relative overflow-hidden">

    <!-- Redirect logged-in users to their dashboard -->
    <script>
        (function() {
            // Check if user is already logged in
            const currentUser = localStorage.getItem('currentUser');
            const userRole = localStorage.getItem('userRole');
            
            // Check if this is a logout (query parameter ?logout=true clears session)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logout') === 'true') {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('userRole');
                // Remove logout parameter from URL
                window.history.replaceState({}, document.title, window.location.pathname);
                return; // Stay on login page after logout
            }
            
            if (currentUser && userRole) {
                const user = JSON.parse(currentUser);
                // Redirect to appropriate dashboard
                switch (user.role) {
                    case 'hoster':
                        window.location.href = 'hoster-dashboard.html';
                        break;
                    case 'poster':
                        window.location.href = 'poster-dashboard.html';
                        break;
                    case 'councillor':
                        window.location.href = 'councillor-dashboard.html';
                        break;
                    default:
                        window.location.href = 'index.html';
                }
            }
        })();
    </script>

    <!-- Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div
            class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-500/20 rounded-full blur-3xl animate-pulse">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500/20 rounded-full blur-3xl animate-pulse"
            style="animation-delay: 1s;"></div>
    </div>

    <div
        class="w-full max-w-5xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col md:flex-row">

        <!-- Left Side: Illustration/Brand -->
        <div
            class="md:w-1/2 bg-gradient-to-br from-primary-600 to-primary-900 p-6 sm:p-8 md:p-12 text-white flex flex-col justify-between relative overflow-hidden">
            <div
                class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80')] bg-cover bg-center opacity-10 mix-blend-overlay">
            </div>
            <div class="relative z-10">
                <div
                    class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-2xl font-bold mb-6">
                    SH</div>
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-4">Welcome to Student Hub</h1>
                <p class="text-primary-100 text-sm sm:text-base md:text-lg">Your gateway to internships, events, and expert career counselling.
                </p>
            </div>
            <div class="relative z-10 mt-12">
                <div class="flex items-center gap-4 text-sm text-primary-200">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-white/20 border-2 border-primary-800"></div>
                        <div class="w-8 h-8 rounded-full bg-white/20 border-2 border-primary-800"></div>
                        <div class="w-8 h-8 rounded-full bg-white/20 border-2 border-primary-800"></div>
                    </div>
                    <span>Join 10,000+ students & experts</span>
                </div>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="md:w-1/2 p-6 sm:p-8 md:p-12 flex flex-col justify-center">
            <h2 class="text-xl sm:text-2xl font-bold mb-2">Sign In</h2>
            <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400 mb-6 sm:mb-8">Enter your credentials to access your account.</p>

            <!-- Sign in with Google Button -->
            <button onclick="handleGoogleLogin()"
                class="w-full py-3.5 min-h-[44px] mb-4 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl shadow-sm transition-all hover:shadow-md flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Sign in with Google</span>
            </button>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400">Or continue with email</span>
                </div>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email
                        Address</label>
                    <input type="email" id="login-email"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="name@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="login-password"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="••••••••" required>
                </div>

                <button type="submit"
                    class="w-full py-3.5 min-h-[44px] bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-600/30 transition-all hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                Don't have an account? <a href="signup.html" class="text-primary-600 font-semibold hover:underline">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Create Account Modal -->
    <div id="create-account-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeCreateAccountModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md mx-4 bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Create Account</h3>
                <button onclick="closeCreateAccountModal()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="handleCreateAccount(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Account Type</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="selectCreateAccountRole('student', this)" 
                            class="create-role-btn group p-3 rounded-xl border-2 border-primary-500 bg-primary-50 dark:bg-primary-900/20 hover:border-primary-500 dark:hover:border-primary-500 transition-all text-left">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                <i data-lucide="graduation-cap" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold block text-xs">Student</span>
                        </button>

                        <button type="button" onclick="selectCreateAccountRole('councillor', this)" 
                            class="create-role-btn group p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary-500 dark:hover:border-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-all text-left">
                            <div class="w-8 h-8 rounded-lg bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                <i data-lucide="users" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold block text-xs">Councillor</span>
                        </button>

                        <button type="button" onclick="selectCreateAccountRole('hoster', this)" 
                            class="create-role-btn group p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary-500 dark:hover:border-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-all text-left">
                            <div class="w-8 h-8 rounded-lg bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                <i data-lucide="calendar" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold block text-xs">Event Hoster</span>
                        </button>

                        <button type="button" onclick="selectCreateAccountRole('poster', this)" 
                            class="create-role-btn group p-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary-500 dark:hover:border-primary-500 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-all text-left">
                            <div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                <i data-lucide="briefcase" class="w-4 h-4"></i>
                            </div>
                            <span class="font-semibold block text-xs">Job Poster</span>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                    <input type="text" id="create-name" required
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="create-email" required
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="create-password" required
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
                    <input type="password" id="create-password-confirm" required
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                        placeholder="••••••••">
                </div>
                <button type="submit"
                    class="w-full py-3.5 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-600/30 transition-all hover:-translate-y-0.5">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2/dist/appwrite.umd.js"></script>
    <script src="appwrite-config.js"></script>
    <script src="shared-data.js"></script>
    <script>
        lucide.createIcons();

        let selectedCreateAccountRole = 'student';

        function selectCreateAccountRole(role, btn) {
            selectedCreateAccountRole = role;
            document.querySelectorAll('.create-role-btn').forEach(b => {
                b.classList.remove('border-2', 'border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                b.classList.add('border', 'border-slate-200', 'dark:border-slate-700');
            });
            btn.classList.remove('border', 'border-slate-200', 'dark:border-slate-700');
            btn.classList.add('border-2', 'border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
        }

        function showCreateAccountModal(e) {
            e.preventDefault();
            selectedCreateAccountRole = 'student';
            // Reset role selection in modal
            document.querySelectorAll('.create-role-btn').forEach(b => {
                b.classList.remove('border-2', 'border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
                b.classList.add('border', 'border-slate-200', 'dark:border-slate-700');
            });
            // Select student by default
            const studentBtn = document.querySelector('.create-role-btn[onclick*="student"]');
            if (studentBtn) {
                studentBtn.classList.remove('border', 'border-slate-200', 'dark:border-slate-700');
                studentBtn.classList.add('border-2', 'border-primary-500', 'bg-primary-50', 'dark:bg-primary-900/20');
            }
            document.getElementById('create-account-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeCreateAccountModal() {
            document.getElementById('create-account-modal').classList.add('hidden');
        }

        function handleCreateAccount(e) {
            e.preventDefault();
            const name = document.getElementById('create-name').value.trim();
            const email = document.getElementById('create-email').value.trim().toLowerCase();
            const password = document.getElementById('create-password').value;
            const passwordConfirm = document.getElementById('create-password-confirm').value;

            // Validate inputs
            if (!name || !email || !password || !passwordConfirm) {
                alert('Please fill in all fields!');
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address!');
                return;
            }

            // Validate password
            if (password.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }

            if (password !== passwordConfirm) {
                alert('Passwords do not match!');
                return;
            }

            // Check if user already exists in database
            if (window.sharedData.getUserByEmail(email)) {
                alert('An account with this email already exists! Please sign in instead.');
                closeCreateAccountModal();
                // Pre-fill email in login form
                document.getElementById('login-email').value = email;
                return;
            }

            // Create user account with selected role from modal
            const user = window.sharedData.createUser({
                name: name,
                email: email,
                password: password,
                role: selectedCreateAccountRole
            });

            alert('Account created successfully! Please sign in with your credentials.');
            closeCreateAccountModal();
            
            // Clear form
            document.getElementById('create-name').value = '';
            document.getElementById('create-email').value = '';
            document.getElementById('create-password').value = '';
            document.getElementById('create-password-confirm').value = '';
            
            // Pre-fill email in login form
            document.getElementById('login-email').value = email;
        }

        async function handleGoogleLogin() {
            try {
                // Wait for Appwrite to initialize
                if (!window.appwriteConfig || !window.appwriteConfig.account) {
                    // Wait a bit and try again
                    setTimeout(() => {
                        if (!window.appwriteConfig || !window.appwriteConfig.account) {
                            alert('Google Sign In is not configured. Please check appwrite-config.js');
                            return;
                        }
                        handleGoogleLogin();
                    }, 500);
                    return;
                }

                const account = window.appwriteConfig.account;
                // Use current origin for redirect URLs (works for both local and GitHub Pages)
                const baseUrl = window.location.origin + (window.location.pathname.includes('/StudentsHub') ? '/StudentsHub' : '');
                const successUrl = baseUrl + '/login.html?success=true';
                const failureUrl = baseUrl + '/login.html?success=false';

                // Create OAuth2 session with Google
                const provider = (typeof sdk !== 'undefined' && sdk.OAuthProvider) 
                    ? sdk.OAuthProvider.Google 
                    : 'google';
                
                await account.createOAuth2Session(
                    provider,
                    successUrl,
                    failureUrl
                );
            } catch (error) {
                console.error('Google Sign In Error:', error);
                alert('Failed to sign in with Google. Please try again or use email sign in.');
            }
        }

        // Handle OAuth callback
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const success = urlParams.get('success');
            
            if (success === 'true') {
                // OAuth successful - get user info
                handleGoogleOAuthSuccess();
            } else if (success === 'false') {
                alert('Google sign in was cancelled or failed. Please try again.');
            }
        });

        async function handleGoogleOAuthSuccess() {
            try {
                // Wait for Appwrite to be ready
                let retries = 0;
                while ((!window.appwriteConfig || !window.appwriteConfig.account) && retries < 10) {
                    await new Promise(resolve => setTimeout(resolve, 200));
                    retries++;
                }

                if (!window.appwriteConfig || !window.appwriteConfig.account) {
                    throw new Error('Appwrite not initialized');
                }

                const account = window.appwriteConfig.account;
                const user = await account.get();
                
                // Check if user exists in local database
                let localUser = window.sharedData.getUserByEmail(user.email);
                
                if (!localUser) {
                    // User doesn't exist - create account with default role (student)
                    localUser = window.sharedData.createUser({
                        name: user.name || user.email.split('@')[0],
                        email: user.email,
                        password: '', // No password for OAuth users
                        role: 'student' // Default role
                    });
                }

                // Store session
                localStorage.setItem('userRole', localUser.role);
                localStorage.setItem('currentUser', JSON.stringify({ 
                    id: localUser.id, 
                    name: localUser.name, 
                    email: localUser.email,
                    role: localUser.role
                }));

                // Redirect based on role
                setTimeout(() => {
                    switch (localUser.role) {
                        case 'hoster':
                            window.location.href = 'hoster-dashboard.html';
                            break;
                        case 'poster':
                            window.location.href = 'poster-dashboard.html';
                            break;
                        case 'councillor':
                            window.location.href = 'councillor-dashboard.html';
                            break;
                        default:
                            window.location.href = 'index.html';
                    }
                }, 500);
            } catch (error) {
                console.error('Error handling OAuth success:', error);
                alert('Sign in successful but there was an error. Please try again.');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Signing In...';
            btn.disabled = true;

            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            // Validate inputs
            if (!email || !password) {
                btn.innerText = originalText;
                btn.disabled = false;
                alert('Please enter both email and password!');
                return;
            }

            // Check if user exists in database
            const user = window.sharedData.getUserByEmail(email);
            
            if (!user) {
                // User doesn't exist
                btn.innerText = originalText;
                btn.disabled = false;
                alert('Account not found! Please create an account first.');
                return;
            }

            // Verify password
            if (user.password !== password) {
                btn.innerText = originalText;
                btn.disabled = false;
                alert('Incorrect password! Please try again.');
                return;
            }

            // Login successful - store user info
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('currentUser', JSON.stringify({ 
                id: user.id, 
                name: user.name, 
                email: user.email,
                role: user.role
            }));

            // Redirect based on role
            setTimeout(() => {
                switch (user.role) {
                    case 'hoster':
                        window.location.href = 'hoster-dashboard.html';
                        break;
                    case 'poster':
                        window.location.href = 'poster-dashboard.html';
                        break;
                    case 'councillor':
                        window.location.href = 'councillor-dashboard.html';
                        break;
                    default:
                        window.location.href = 'index.html';
                }
            }, 500);
        }

        // Pre-fill email if coming from signup page
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            if (email) {
                document.getElementById('login-email').value = email;
            }
        });
    </script>
</body>

</html>
